<!DOCTYPE html>
<html>

<head>
    <title>Mao's OS</title>

    <style>
        body {
            margin: 0;
            background: #FFDFD9;
            font-family: Arial, sans-serif;
        }

        .desktop {
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .icon {
            width: 80px;
            text-align: center;
            color: white;
        }

        .icon-image {
            font-size: 45px;
        }

        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #222;
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .start-button {
            color: white;
            font-size: 20px;
        }

        #files-window {
            display: none;
            position: fixed;
            top: 20%;
            left: 20%;
            width: 60%;
            height: 50%;
            background: white;
            border: 3px solid #222;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
        }
        #files-window {
    display: none;
    position: fixed;
    top: 20%;
    left: 20%;
    width: 60%;
    height: 50%;
    background: white;
    border: 3px solid #222;
    border-radius: 10px;
    padding: 20px;
    box-sizing: border-box;
}

.window-bar {
    height: 40px;
    background: #222;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    box-sizing: border-box;
}

.window-bar button {
    background: none;
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.window-content {
    padding: 20px;
}

        .file {
    display: inline-block;
    width: 100px;
    text-align: center;
    margin: 10px;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
}

.file:hover {
    background: #eeeeee;
}

.file-icon {
    font-size: 40px;
}
        
</style>
</head>

<body>

    <div class="desktop">

        <div
            class="icon" onclick="openFiles()">
            <div class="icon-image">📁</div>
            <div>Files</div>
        </div>

    </div>

<div id="files-window">

    <div class="window-bar">
        <span>📁 Files</span>
        <button onclick="closeFiles()">✕</button>
    </div>
    <div class="window-content">

    <div class="file">
        <div class="file-icon">📄</div>
        <div>secrets.txt</div>
    </div>

    <div class="file">
        <div class="file-icon">📄</div>
        <div>README.txt</div>
    </div>

    <div class="file">
        <div class="file-icon">🖼️</div>
        <div>maomao.png</div>
    </div>

    <div class="file">
        <div class="file-icon">📁</div>
        <div>Games</div>
    </div>

</div>

</div>

    <div class="taskbar">
        <div class="start-button">🐟 Mao</div>
    </div>

    <script>
    function openFiles() {
        document.getElementById("files-window").style.display = "block";
    }

    function closeFiles() {
        document.getElementById("files-window").style.display = "none";
    }
</script>
    
</body>

</html>
