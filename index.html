<!DOCTYPE html>
<html>

<head>
    <title>Mao's OS</title>

    <style>
        body {
            margin: 0;
            background: #9bd8d8;
            font-family: Arial, sans-serif;
        }

        .desktop {
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .icon {
            width: 80px;
            text-align: center;
            color: white;
        }

        .icon-image {
            font-size: 45px;
        }

        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #222;
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .start-button {
            color: white;
            font-size: 20px;
        }

        #files-window {
            display: none;
            position: fixed;
            top: 20%;
            left: 20%;
            width: 60%;
            height: 50%;
            background: white;
            border: 3px solid #222;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div class="desktop">

        <div
            class="icon" onclick="openFiles()">
            <div class="icon-image">📁</div>
            <div>Files</div>
        </div>

    </div>

    <div id="files-window">
        <h2>📁 Files</h2>
        <p>Welcome to your files!</p>
    </div>

    <div class="taskbar">
        <div class="start-button">🐟 Mao</div>
    </div>

        <script>
        function openFiles() {
            document.getElementById("files-window").style.display = "block";
        }
    </script>
    
</body>

</html>
