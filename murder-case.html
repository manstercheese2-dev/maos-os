<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CASE 017 — Restricted Archive</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: #080808;
    color: #d8d8d8;
    font-family: "Courier New", monospace;
}

body {
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.018) 0px,
            rgba(255,255,255,0.018) 1px,
            transparent 1px,
            transparent 4px
        ),
        #080808;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    height: 58px;
    border-bottom: 1px solid #333;
    background: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.top-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.archive-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: #777;
}

.case-number {
    font-size: 14px;
    letter-spacing: 2px;
}

.status {
    border: 1px solid #555;
    padding: 5px 9px;
    font-size: 8px;
    letter-spacing: 2px;
}

/* =========================
   LAYOUT
========================= */

.app {
    display: flex;
    min-height: calc(100vh - 58px);
}

.sidebar {
    width: 285px;
    flex-shrink: 0;
    background: #0c0c0c;
    border-right: 1px solid #333;
    padding: 20px 14px;
    overflow-y: auto;
}

.sidebar-heading {
    color: #666;
    font-size: 8px;
    letter-spacing: 3px;
    margin: 5px 7px 15px;
}

.file-button {
    width: 100%;
    border: 0;
    background: transparent;
    color: #999;
    text-align: left;
    padding: 10px 8px;
    margin-bottom: 2px;
    font-family: inherit;
    cursor: pointer;
    font-size: 10px;
    letter-spacing: 1px;
    transition: 0.15s;
}

.file-button:hover {
    background: #191919;
    color: #eee;
}

.file-button.active {
    background: #ddd;
    color: #080808;
}

.file-button.locked {
    color: #444;
}

.sidebar-separator {
    height: 1px;
    background: #292929;
    margin: 16px 5px;
}

.main {
    flex: 1;
    padding: 35px;
    overflow-y: auto;
}

/* =========================
   DOCUMENT
========================= */

.document {
    width: min(900px, 100%);
    min-height: 760px;
    margin: 0 auto;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(0,0,0,0.015) 0px,
            rgba(0,0,0,0.015) 1px,
            transparent 1px,
            transparent 5px
        ),
        #e8e8e8;
    color: #151515;
    padding: 55px 65px;
    box-shadow: 0 0 50px rgba(0,0,0,0.7);
    position: relative;
}

.document:before {
    content: "";
    position: absolute;
    inset: 12px;
    border: 1px solid #bbb;
    pointer-events: none;
}

.document-header {
    display: flex;
    justify-content: space-between;
    border-bottom: 3px solid #171717;
    padding-bottom: 16px;
    margin-bottom: 30px;
}

.department {
    font-size: 8px;
    letter-spacing: 3px;
}

.document h1 {
    font-size: 27px;
    letter-spacing: 3px;
    margin: 6px 0 0;
}

.classification {
    text-align: right;
    font-size: 8px;
    letter-spacing: 2px;
    line-height: 1.8;
}

.document p {
    font-family: Georgia, serif;
    font-size: 16px;
    line-height: 1.8;
}

.document hr {
    border: 0;
    border-top: 1px solid #999;
    margin: 28px 0;
}

/* =========================
   COVER
========================= */

.cover {
    text-align: center;
    min-height: 650px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.cover-small {
    font-size: 9px;
    letter-spacing: 4px;
    color: #555;
}

.cover h1 {
    font-size: 64px;
    font-weight: normal;
    letter-spacing: 10px;
    margin: 25px 0;
}

.cover-title {
    font-size: 19px;
    letter-spacing: 4px;
    margin-bottom: 50px;
}

.cover-line {
    width: 70%;
    height: 1px;
    background: #333;
    margin: 0 auto 35px;
}

.cover-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-left: 1px solid #888;
    border-top: 1px solid #888;
    margin: 0 auto;
    width: 80%;
}

.cover-info div {
    border-right: 1px solid #888;
    border-bottom: 1px solid #888;
    padding: 15px;
}

.cover-info span {
    display: block;
    font-size: 8px;
    color: #777;
    letter-spacing: 2px;
    margin-bottom: 7px;
}

.cover-info strong {
    font-size: 11px;
    letter-spacing: 1px;
}

.stamp {
    margin: 40px auto 0;
    border: 4px solid #222;
    padding: 10px 20px;
    display: inline-block;
    transform: rotate(-4deg);
    font-size: 20px;
    letter-spacing: 4px;
}

/* =========================
   BOXES
========================= */

.important {
    border: 2px solid #222;
    padding: 18px;
    margin: 25px 0;
    font-family: "Courier New", monospace;
    font-size: 12px;
    letter-spacing: 1px;
}

.margin-note {
    border-left: 2px solid #444;
    padding: 15px 18px;
    margin: 30px 0;
    font-family: "Comic Sans MS", cursive;
    font-style: italic;
    transform: rotate(-1deg);
}

.typewriter {
    font-family: "Courier New", monospace !important;
    font-size: 13px !important;
    line-height: 2 !important;
}

/* =========================
   SUSPECTS
========================= */

.suspect {
    border-bottom: 1px solid #999;
    padding: 24px 0;
}

.suspect:last-child {
    border-bottom: 0;
}

.suspect-name {
    font-size: 20px;
    letter-spacing: 2px;
    margin-bottom: 5px;
}

.suspect-meta {
    color: #666;
    font-size: 9px;
    letter-spacing: 1px;
}

.suspect p {
    font-size: 14px;
    margin: 10px 0;
}

/* =========================
   TIMELINE
========================= */

.timeline {
    border-left: 2px solid #333;
    margin-left: 40px;
}

.timeline-row {
    display: grid;
    grid-template-columns: 70px 20px 1fr;
    min-height: 55px;
    align-items: center;
}

.timeline-time {
    font-size: 11px;
    font-weight: bold;
}

.timeline-dot {
    width: 9px;
    height: 9px;
    background: #222;
    border-radius: 50%;
    margin-left: -5px;
}

.timeline-event {
    padding-left: 15px;
    font-family: Georgia, serif;
    font-size: 14px;
}

/* =========================
   PHOTOGRAPHS
========================= */

.photo-frame {
    background: #ccc;
    border: 1px solid #222;
    padding: 8px;
    margin: 25px 0;
}

.photo-frame svg {
    display: block;
    width: 100%;
    filter: grayscale(1) contrast(1.15);
}

.photo-label {
    font-size: 9px;
    letter-spacing: 2px;
    line-height: 1.8;
    margin-top: 10px;
}

/* =========================
   REDACTIONS
========================= */

.redaction {
    display: inline-block;
    background: #111;
    height: 16px;
    vertical-align: middle;
    margin: 0 3px;
}

.redacted-page {
    font-family: "Courier New", monospace;
    font-size: 13px;
    line-height: 2.3;
}

.redacted-page p {
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
}

.redacted-quote {
    border-left: 4px solid #222;
    padding: 18px;
    margin: 30px 0;
    font-family: Georgia, serif;
    font-size: 18px;
    line-height: 2;
    font-style: italic;
}

/* =========================
   TABLE
========================= */

.records {
    width: 100%;
    border-collapse: collapse;
    font-size: 10px;
}

.records th,
.records td {
    border: 1px solid #666;
    padding: 11px 8px;
    text-align: left;
}

.records th {
    background: #ccc;
    letter-spacing: 1px;
}

/* =========================
   NOTES
========================= */

textarea {
    width: 100%;
    min-height: 380px;
    resize: vertical;
    border: 1px solid #777;
    background:
        repeating-linear-gradient(
            transparent,
            transparent 30px,
            #aaa 31px
        ),
        #eee;
    color: #111;
    font-family: "Comic Sans MS", cursive;
    font-size: 16px;
    line-height: 31px;
    padding: 10px;
}

.answer-box {
    min-height: 300px;
    background: #ededed;
}

button.action {
    background: #111;
    color: #eee;
    border: 1px solid #777;
    padding: 12px 22px;
    margin-top: 15px;
    font-family: inherit;
    letter-spacing: 2px;
    cursor: pointer;
}

button.action:hover {
    background: #eee;
    color: #111;
}

.sealed {
    margin-top: 25px;
    padding: 18px;
    border: 2px solid #222;
    font-size: 10px;
    letter-spacing: 2px;
    line-height: 2;
}

/* =========================
   EVIDENCE TAG
========================= */

.evidence-tag {
    display: inline-block;
    border: 1px solid #555;
    padding: 5px 8px;
    font-size: 8px;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 800px) {

    .sidebar {
        width: 210px;
    }

    .main {
        padding: 15px;
    }

    .document {
        padding: 35px 25px;
    }

    .cover h1 {
        font-size: 38px;
    }

}

</style>
</head>

At approximately <b>23:41</b> on 17 October 2019,

report of an unconscious male.
</p>

<p>
The victim was identified as <b>Adrian Blackwood</b>,
aged 48.
</p>

<div class="important">

Severe cranial trauma.

<br><br>

<b>INITIAL ESTIMATED TIME OF DEATH</b><br>
22:10 — 23:10

</div>

<p>
No obvious signs of forced entry were discovered.
The front door was locked when officers arrived.
</p>

<p>
The victim's private study showed signs of disturbance.
A locked drawer had been opened and several documents
were missing.
</p>

<p>
Four individuals were identified as persons of interest.
</p>

<div class="margin-note">
Whoever did this knew the house.
<br>
They also knew exactly what they were looking for.
</div>

<div class="evidence-tag">
INVESTIGATION NOTE / 18 OCTOBER 2019
</div>

<p>
The initial timeline should not be considered definitive.
</p>

function openFile(name, button) {

    if (!documents[name]) {
        return;
    }

    document.getElementById("document-container").innerHTML =
        documents[name];

    document.querySelectorAll(".file-button").forEach(btn => {
        btn.classList.remove("active");
    });

    if (button) {
        button.classList.add("active");
    }

    window.scrollTo(0,0);

    restoreNotes();

}

    const notesBox =
        document.getElementById("investigator-notes");

    if (notesBox) {

        notesBox.value =

        notesBox.addEventListener("input", function() {

            localStorage.setItem(
                "case017_notes",
                this.value
            );

        });

    }

}

function sealAnswer() {

    const answer =
